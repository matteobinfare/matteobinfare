<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINANC 4201 — Practice Exams</title>
<meta name="description" content="Practice exams with worked solutions for FINANC 4201 Alternative Investments: Quantitative Methods and Performance Evaluation.">
<style>
:root{
  --paper:#F7F5F1; --card:#FFFFFF; --line:#E4DED3; --soft:#F0EBE2;
  --ink:#23262B; --ink2:#4C525A; --label:#7C7591; --mute:#948F88;
  --gold:#9C7419; --goldhi:#B8901F; --goldbg:#F8F1DE; --goldln:#C9A227;
  --easybg:#E9F3EA; --easyfg:#2E6B3E; --easyln:#CBE3CF;
  --medbg:#FDF3DC; --medfg:#8A6516; --medln:#EFDFB0;
  --hardbg:#FBEAEE; --hardfg:#A03A52; --hardln:#F0CBD5;
  --ok:#1D7A4F; --okbg:#EAF5EE; --okln:#BFE0CC;
  --no:#B03A2E; --nobg:#FBEDEA; --noln:#F0CFC8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px; --rs:7px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
h1{font:600 30px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
h2{font:600 21px/1.3 var(--sans);margin:0}
h3{font:600 16px/1.35 var(--sans);margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--goldln);outline-offset:2px;border-radius:4px}

/* ---------- header ---------- */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:11px 0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .sq{width:34px;height:34px;border-radius:8px;background:var(--gold);color:#fff;display:grid;place-items:center;
  font:700 12px/1 var(--sans);letter-spacing:.02em;flex:none}
.brand .tx{min-width:0}
.brand .t1{font:700 14px/1.2 var(--sans)}
.brand .t2{font:400 11.5px/1.3 var(--sans);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:99px}
.tabs button{font:500 13.5px var(--sans);border:0;background:none;color:var(--ink2);padding:9px 15px;border-radius:99px;cursor:pointer;min-height:34px}
.tabs button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(35,38,43,.1)}

main{padding:26px 0 90px}

/* ---------- summary ticket ---------- */
.ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 18px 30px;position:relative;
  display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ticket:before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:6px;border-radius:3px;
  background:repeating-linear-gradient(to bottom,var(--goldln) 0 7px,transparent 7px 14px)}
.sum{display:grid;gap:2px 34px;grid-template-columns:1fr;flex:1;min-width:230px}
@media(min-width:680px){.sum{grid-template-columns:1fr 1fr}}
.sum .it{padding:7px 0;border-bottom:1px dashed var(--line)}
.sum .k{font:600 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.sum .v{font:600 15px/1.4 var(--mono);color:var(--ink);margin-top:4px}
.disc{width:96px;height:96px;border-radius:50%;border:2px solid var(--goldln);display:grid;place-items:center;text-align:center;flex:none}
.disc b{display:block;font:600 22px/1 var(--mono);color:var(--gold)}
.disc span{display:block;font:600 8px/1.3 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--label);margin-top:4px}

/* ---------- fieldset cards ---------- */
fieldset.fs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 15px;margin:0;min-width:0}
fieldset.fs>legend{font:600 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--label);padding:0 7px;margin-left:4px}
.cols{display:grid;gap:16px;grid-template-columns:1fr;margin-top:18px}
@media(min-width:780px){.cols{grid-template-columns:1.05fr .95fr;align-items:start}}
.colstack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---------- topic list ---------- */
.selrow{display:flex;gap:8px;align-items:center;font:500 13px var(--sans);margin-bottom:8px}
.selrow button{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font:500 13px var(--sans);padding:8px 3px;min-height:34px}
.selrow i{font-style:normal;color:var(--mute)}
.tlist{max-height:292px;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:1px}
.tlist::-webkit-scrollbar{width:8px}
.tlist::-webkit-scrollbar-thumb{background:#DAD3C7;border-radius:99px}
.trow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;
  padding:9px 6px;border-radius:var(--rs);cursor:pointer;font:14.5px/1.4 var(--sans);color:var(--ink);min-height:38px}
.trow:hover{background:var(--soft)}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid #C9C2B6;background:#fff;flex:none;margin-top:1px;
  display:grid;place-items:center;color:#fff;font:700 11px/1 var(--sans)}
.trow[aria-pressed="true"] .box{background:var(--gold);border-color:var(--gold)}
.trow .cd{font:600 11.5px/1.5 var(--mono);color:var(--label);flex:none;width:26px;margin-top:1px}
.trow .nm{flex:1}
.trow .ct{font:500 11.5px/1.6 var(--mono);color:var(--mute);flex:none}

/* ---------- pills ---------- */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;font:500 13.5px var(--sans);background:#fff;color:var(--ink2);
  border:1px solid var(--line);padding:8px 14px;border-radius:99px;cursor:pointer;min-height:36px}
.pill:hover{border-color:#CFC7B8}
.pill .n{font:500 11.5px var(--mono);color:var(--mute)}
.pill[aria-pressed="true"]{background:var(--goldbg);border-color:var(--goldln);color:var(--ink)}
.pill.e[aria-pressed="true"]{background:var(--easybg);border-color:var(--easyln);color:var(--easyfg)}
.pill.m[aria-pressed="true"]{background:var(--medbg);border-color:var(--medln);color:var(--medfg)}
.pill.h[aria-pressed="true"]{background:var(--hardbg);border-color:var(--hardln);color:var(--hardfg)}
.pill[aria-pressed="true"] .n{color:inherit;opacity:.65}

/* ---------- stepper ---------- */
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;width:max-content;background:#fff}
.step button{width:44px;border:0;background:var(--soft);color:var(--ink);font:500 19px/1 var(--sans);cursor:pointer}
.step button:hover{background:#E7E1D6}
.step input{width:104px;border:0;text-align:center;font:600 16px var(--mono);color:var(--ink);background:#fff;padding:9px 0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{font:500 13px var(--mono);background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 17px;cursor:pointer;color:var(--ink2);min-height:34px}
.quick button[aria-pressed="true"]{background:var(--goldbg);border-color:var(--goldln);color:var(--ink)}

/* ---------- switches ---------- */
.sw{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:7px 0}
.sw+.sw{border-top:1px solid var(--soft)}
.track{width:38px;height:22px;border-radius:99px;background:#D5CFC4;flex:none;position:relative;transition:background .16s;margin-top:1px}
.knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-pressed="true"] .track{background:var(--gold)}
.sw[aria-pressed="true"] .knob{left:19px}
.sw .lb{font:500 14.5px/1.35 var(--sans);color:var(--ink)}
.sw .hp{font:12.5px/1.45 var(--sans);color:var(--mute);margin-top:3px}

/* ---------- buttons ---------- */
.btn{font:600 15px var(--sans);background:var(--gold);color:#fff;border:1px solid var(--gold);
  padding:12px 22px;border-radius:var(--rs);cursor:pointer}
.btn:hover{background:#8A6615}
.btn.ghost{background:#fff;color:var(--ink2);border-color:var(--line);font-weight:500}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{font-size:13px;padding:9px 15px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--gold)}
.linkb{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;font:500 13px var(--sans);padding:8px 2px;min-height:34px}

/* ---------- misc ---------- */
.avail{color:var(--ink2);font-size:14px;margin:20px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:20px;border-top:1px solid var(--line)}
.note{border-radius:var(--rs);padding:11px 14px;font-size:14px;margin-bottom:20px}
.note.g{background:var(--goldbg);color:#795910;border:1px solid var(--medln)}
.chip{display:inline-flex;align-items:center;font:500 11.5px/1.7 var(--sans);padding:1px 9px;border-radius:99px;
  background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.chip.e{background:var(--easybg);color:var(--easyfg);border-color:var(--easyln)}
.chip.m{background:var(--medbg);color:var(--medfg);border-color:var(--medln)}
.chip.h{background:var(--hardbg);color:var(--hardfg);border-color:var(--hardln)}
.chip.gd{background:var(--goldbg);color:#7A5A10;border-color:var(--medln)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;color:var(--ink2)}

/* ---------- progress strip ---------- */
.pbar{position:sticky;top:57px;z-index:30;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.pbar .in{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.track2{flex:1;min-width:130px;height:7px;background:#E7E1D6;border-radius:99px;overflow:hidden}
.track2 span{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .2s}
.pbar .ct{font:600 12.5px var(--mono);color:var(--ink2);flex:none}
.clock{font:600 15px var(--mono);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 13px;flex:none}
.clock.warn{color:var(--no);border-color:var(--noln);background:var(--nobg)}

/* ---------- questions ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.q.hide{display:none}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:13px}
.qnum{width:29px;height:29px;border-radius:8px;background:var(--soft);color:var(--ink2);display:grid;place-items:center;
  font:600 13px/1 var(--mono);flex:none}
.q.right .qnum{background:var(--okbg);color:var(--ok)}
.q.wrong .qnum{background:var(--nobg);color:var(--no)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1}
.qmeta .tp{font:12.5px var(--sans);color:var(--mute)}
.prompt{font-size:16px;line-height:1.6}
ul.bul{margin:12px 0 0;padding:0;list-style:none}
ul.bul li{font-size:14.5px;color:var(--ink2);padding-left:17px;position:relative;margin-bottom:5px}
ul.bul li:before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--goldln)}
.scroll{overflow-x:auto;margin:15px 0}
table.data{border-collapse:collapse;font-size:14px;min-width:min(100%,240px)}
table.data th{font:600 9.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--label);
  text-align:left;padding:9px 18px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:7px 18px 7px 0;border-bottom:1px solid var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.flds{margin-top:18px;display:flex;flex-direction:column;gap:13px}
.fld label{display:block;font:500 14px/1.4 var(--sans);color:var(--ink2);margin-bottom:6px}
.inw{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.ib{position:relative;display:inline-flex;align-items:center}
.ib input{width:150px;font:500 15px var(--mono);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--rs);
  padding:10px 40px 10px 12px;background:#fff}
.ib input:focus{border-color:var(--goldln)}
.ib .sfx{position:absolute;right:12px;font:500 13px var(--mono);color:var(--mute);pointer-events:none}
.ib input.ok{border-color:var(--okln);background:var(--okbg)}
.ib input.no{border-color:var(--noln);background:var(--nobg)}
.fb{font:500 13px var(--sans)}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)} .fb.na{color:var(--mute)}
textarea{width:100%;font:15px/1.55 var(--sans);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--rs);
  padding:11px 12px;background:#fff;resize:vertical}
textarea:focus{border-color:var(--goldln)}

.chs{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.ch{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:15px/1.5 var(--sans);color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:var(--rs);padding:12px 14px;cursor:pointer}
.ch:hover{border-color:#CFC7B8;background:#FCFBF8}
.ch .lt{width:23px;height:23px;border-radius:50%;border:1.5px solid #C9C2B6;flex:none;display:grid;place-items:center;
  font:600 11.5px/1 var(--mono);color:var(--label);background:#fff}
.ch[aria-pressed="true"]{border-color:var(--goldln);background:var(--goldbg)}
.ch[aria-pressed="true"] .lt{background:var(--gold);border-color:var(--gold);color:#fff}
.ch.key{border-color:var(--okln);background:var(--okbg)}
.ch.key .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.bad{border-color:var(--noln);background:var(--nobg)}
.ch.bad .lt{background:var(--no);border-color:var(--no);color:#fff}

.sol{margin-top:18px;background:#FDFCF9;border:1px solid var(--medln);border-left:3px solid var(--goldln);
  border-radius:var(--rs);padding:15px 17px}
.sol .hd{font:600 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}
.sol p{font-size:14.5px;line-height:1.6;color:var(--ink2);margin-bottom:10px}
.sol p:last-child{margin-bottom:0}
.sol pre{margin:0 0 12px;background:#fff;border:1px solid var(--soft);border-radius:6px;padding:12px 13px;
  font:12.5px/1.7 var(--mono);color:var(--ink);overflow-x:auto;white-space:pre}
.sol ol{margin:0;padding-left:19px}
.sol ol li{font-size:14.5px;line-height:1.6;color:var(--ink2);margin-bottom:9px}
.sol .src{font-size:12.5px;color:var(--mute)}
.qf{margin-top:16px;padding-top:13px;border-top:1px solid var(--soft);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.qf .lo{font-size:12.5px;color:var(--mute);flex:1;min-width:180px}

/* ---------- score ---------- */
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:20px;
  display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{width:104px;height:104px;flex:none}
.ring circle{fill:none;stroke-width:3.2}
.ring .bg{stroke:#EAE4D9}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle}
.scb{flex:1;min-width:190px}
.scb .big{font:600 27px/1.2 var(--sans)}
.scb .sub{font-size:14px;color:var(--ink2);margin-top:5px}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.bar{display:flex;gap:11px;align-items:center;font-size:13px}
.bar .nm{flex:1;min-width:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{width:110px;height:7px;background:#EAE4D9;border-radius:99px;flex:none;overflow:hidden}
.bar .fl{display:block;height:100%;background:var(--goldhi);border-radius:99px}
.bar .fl.g{background:var(--ok)} .bar .fl.p{background:var(--no)}
.bar .vl{font:500 12px var(--mono);color:var(--mute);flex:none;width:38px;text-align:right}

.stats{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));margin:18px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.stat .k{font:600 9.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--label)}
.stat .v{font:600 24px/1.2 var(--mono);margin-top:7px}
.stat .v i{font-style:normal;font-size:13px;color:var(--mute)}

/* ---------- formulas / browse ---------- */
.srch{width:100%;font:15px var(--sans);border:1.5px solid var(--line);border-radius:var(--rs);padding:11px 13px;background:#fff}
.srch:focus{border-color:var(--goldln)}
.fml{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.fml .nm{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.fml .nm b{font:600 14.5px var(--sans)}
.fml .nm em{font-style:normal;font-size:12px;color:var(--mute);flex:none}
.fml pre{margin:9px 0 0;background:#FBFAF7;border:1px solid var(--soft);border-radius:6px;padding:11px 12px;
  font:12.5px/1.7 var(--mono);overflow-x:auto;white-space:pre}
.sect{font:600 9.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:26px 0 12px}

footer{border-top:1px solid var(--line);padding:20px 0 60px;color:var(--mute);font-size:12.5px;line-height:1.7}

@media(max-width:620px){
  h1{font-size:24px} .disc{width:74px;height:74px} .disc b{font-size:17px}
  .q{padding:16px} .ib input{width:100%} .ib{width:100%}
  .pbar{top:53px}
}
@media print{
  .top,.tabs,.pbar,.qf,.actions,button{display:none!important}
  body{background:#fff;font-size:11pt}
  .q{break-inside:avoid;border-color:#ccc}
  main{padding:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <div class="sq">4201</div>
      <div class="tx">
        <div class="t1">Alternative Investments</div>
        <div class="t2">Quantitative Methods &amp; Performance Evaluation</div>
      </div>
    </div>
    <nav class="tabs" id="nav"></nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="wrap"><p id="foot"></p></footer>

<script src="bank.json"></script>
<script>
"use strict";
/* ============================================================
   FINANC 4201 practice site.
   Fixed question bank from bank.json. No network, no dependencies,
   no accounts. Runs offline and from file://
   ============================================================ */
var B = window.FIN4201_BANK;
var TL = {}, TCODE = {};
B.topics.forEach(function (t, i) { TL[t.id] = t.label; TCODE[t.id] = "T" + (i + 1); });
var KINDL = { quant: "Quantitative", mc: "Multiple choice", short: "Short answer" };
var KINDW = { quant: 3, mc: 2, short: 1 };
var DIFFC = { easy: "e", medium: "m", hard: "h" };
var DEFTOL = { pct: 0.0005, num: 0.02, usd: 0.05, int: 0.0001 };

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function pct(x, d) { return (x * 100).toFixed(d == null ? 2 : d) + "%"; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.random() * (i + 1) | 0; var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* progress lives in the student's own browser; falls back to memory if blocked */
var store = (function () {
  var KEY = "fin4201.progress.v1", mem = null, ok = true;
  try { window.localStorage.getItem(KEY); } catch (e) { ok = false; }
  function blank() { return { seen: {}, topic: {}, attempts: 0, right: 0, total: 0 }; }
  return {
    available: ok,
    read: function () {
      if (mem) return mem;
      if (ok) { try { mem = JSON.parse(window.localStorage.getItem(KEY)) || blank(); } catch (e) { mem = blank(); } } else mem = blank();
      if (!mem.seen) mem = blank();
      return mem;
    },
    write: function (v) { mem = v; if (!ok) return; try { window.localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { } },

/* ---------- counting for the live readouts ---------- */
function matches(cfg) {
  return B.questions.filter(function (q) {
    if (cfg.topics.indexOf(q.topic) < 0) return false;
    if (cfg.types.indexOf(q.kind) < 0) return false;
    if (cfg.diffs.length && cfg.diffs.indexOf(q.diff) < 0) return false;
    return true;
  });
}
function countBy(cfg, over, val) {
  var c = { topics: cfg.topics, types: cfg.types, diffs: cfg.diffs };
  c[over] = [val];
  return matches(c).length;
}

/* ============================================================
   DRAWING A PAPER
   Honours the requested difficulty and prefers unseen questions,
   while avoiding two variants of the same template where it can.
   ============================================================ */
function drawExam(cfg) {
  var prog = store.read();
  function pool(kind) {
    return B.questions.filter(function (q) {
      return q.kind === kind && cfg.topics.indexOf(q.topic) >= 0;
    });
  }
  function keyed(list) {
    return list.map(function (q) {
      var k = Math.random();
      if (cfg.diffs.length && cfg.diffs.indexOf(q.diff) < 0) k += 10;
      if (cfg.unseen && prog.seen[q.id]) k += 3;
      return { q: q, k: k };
    }).sort(function (a, b) { return a.k - b.k; });
  }
  function take(list, n, used) {
    var out = [], rest = [];
    keyed(list).forEach(function (x) {
      if (out.length < n && !used[x.q.template]) { used[x.q.template] = 1; out.push(x.q); }
      else rest.push(x.q);
    });
    for (var i = 0; out.length < n && i < rest.length; i++) out.push(rest[i]);
    return out;
  }

  var kinds = cfg.types.slice(), pools = {};
  kinds.forEach(function (k) { pools[k] = pool(k); });
  kinds = kinds.filter(function (k) { return pools[k].length > 0; });
  if (!kinds.length) return [];

  // split the paper across the chosen types by weight, capped by what exists
  var wsum = kinds.reduce(function (s, k) { return s + KINDW[k]; }, 0);
  var want = { quant: 0, mc: 0, short: 0 };
  kinds.forEach(function (k) { want[k] = Math.min(pools[k].length, Math.round(cfg.count * KINDW[k] / wsum)); });
  var total = function () { return want.quant + want.mc + want.short; };
  var guard = 0;
  while (total() < cfg.count && guard++ < 900) {
    var k2 = kinds.filter(function (x) { return want[x] < pools[x].length; })
      .sort(function (a, b) { return KINDW[b] - KINDW[a]; })[0];
    if (!k2) break;
    want[k2]++;
  }
  while (total() > cfg.count && guard++ < 900) {
    var k3 = kinds.filter(function (x) { return want[x] > 0; }).sort(function (a, b) { return KINDW[a] - KINDW[b]; })[0];
    if (!k3) break;
    want[k3]--;
  }

  var used = {}, out = [];
  kinds.forEach(function (k) { out = out.concat(take(pools[k], want[k], used)); });
  if (cfg.randomize) out = shuffle(out);
  return out.slice(0, cfg.count).map(prepare);
}
function prepare(q, i) {
  var c = { n: i + 1 };
  for (var p in q) c[p] = q[p];
  if (q.kind === "mc") {
    var idx = shuffle(q.choices.map(function (_, j) { return j; }));
    c.choices = idx.map(function (j) { return q.choices[j]; });
    c.correct = idx.indexOf(q.correct);
  }
  return c;
}

/* ---------- grading ---------- */
function parseNum(s) {
  if (s == null) return null;
  var t = String(s).replace(/[$,\s%]/g, "");
  if (t === "" || t === "-" || t === ".") return null;
  var v = Number(t);
  return isFinite(v) ? v : null;
}
function gradePart(p, raw) {
  if (p.unit === "text") return "self";
  var v = parseNum(raw);
  if (v === null) return "blank";
  var tol = p.tol != null ? p.tol : (DEFTOL[p.unit] != null ? DEFTOL[p.unit] : 0.02);
  var cands = p.unit === "pct" ? [v / 100, v] : [v];
  for (var i = 0; i < cands.length; i++) if (Math.abs(cands[i] - p.answer) <= tol) return "right";
  return "wrong";
}
function fmtAns(p) {
  if (p.unit === "pct") return pct(p.answer, 2);
  if (p.unit === "usd") return "$" + p.answer.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (p.unit === "int") return String(Math.round(p.answer));
  return p.answer.toFixed(3);
}
function sfxOf(u) { return u === "pct" ? "%" : u === "usd" ? "$" : u === "int" ? "" : ""; }
function hintOf(u) { return u === "pct" ? "e.g. 5.25" : u === "usd" ? "e.g. 1250.00" : u === "int" ? "e.g. 7" : "e.g. 0.42"; }

/* mark one question; returns {right, possible, self} */
function markOne(q, node, lock) {
  var e = 0, p = 0, self = 0;
  if (q.kind === "quant") {
    q.parts.forEach(function (part, j) {
      var inp = node.querySelector('[data-p="' + j + '"]');
      var st = node.querySelector('[data-st="' + j + '"]');
      var g = gradePart(part, inp ? inp.value : "");
      if (g === "self") { self++; return; }
      p++;
      inp.classList.remove("ok", "no");
      if (g === "right") { e++; inp.classList.add("ok"); st.className = "fb ok"; st.textContent = "Correct"; }
      else if (g === "wrong") { inp.classList.add("no"); st.className = "fb no"; st.textContent = "Answer: " + fmtAns(part); }
      else { st.className = "fb na"; st.textContent = "Answer: " + fmtAns(part); }
      if (lock) inp.setAttribute("readonly", "readonly");
    });
  } else if (q.kind === "mc") {
    p = 1;
    var chosen = (S.answers[q.n] && S.answers[q.n].choice != null) ? S.answers[q.n].choice : null;
    if (chosen === q.correct) e = 1;
    var btns = node.querySelectorAll(".ch");
    for (var k = 0; k < btns.length; k++) {
      if (lock) btns[k].disabled = true;
      btns[k].classList.remove("key", "bad");
      if (k === q.correct) btns[k].classList.add("key");
      else if (k === chosen) btns[k].classList.add("bad");
    }
    var hd = node.querySelector("[data-hd]");
    if (hd) hd.textContent = chosen == null ? "Answer" : (e ? "Correct" : "Not quite");
  } else self++;

  var sol = node.querySelector(".sol");
  if (sol) sol.hidden = false;
  var cb = node.querySelector("[data-check]");
  if (cb) cb.remove();
  node.classList.remove("right", "wrong");
  if (p > 0) node.classList.add(e === p ? "right" : "wrong");
  return { right: e, possible: p, self: self };
}

function grade() {
  var earned = 0, possible = 0, self = 0, byTopic = {}, missed = [];
  var nodes = document.querySelectorAll("#qs .q");
  S.exam.forEach(function (q, i) {
    var r = markOne(q, nodes[i], true);
    earned += r.right; possible += r.possible; self += r.self;
    if (r.possible > 0) {
      if (!byTopic[q.topic]) byTopic[q.topic] = { right: 0, total: 0 };
      byTopic[q.topic].right += r.right; byTopic[q.topic].total += r.possible;
      if (r.right < r.possible) missed.push(q.id);
    }
  });
  return { earned: earned, possible: possible, self: self, byTopic: byTopic, missed: missed };
}

function submitExam() {
  if (S.submitted) return;
  S.submitted = true;
  if (S.tick) { clearInterval(S.tick); S.tick = null; }
  applyGrade(true);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Progress is recorded on first submission only, so navigating away
   and back repaints the same result without inflating the stats. */

  if (record) {
    var prog = store.read();
    prog.attempts++;
    S.exam.forEach(function (q) { prog.seen[q.id] = 1; });
    prog.right += sc.earned; prog.total += sc.possible;
    for (var t in sc.byTopic) {
      if (!prog.topic[t]) prog.topic[t] = { right: 0, total: 0 };
      prog.topic[t].right += sc.byTopic[t].right;
      prog.topic[t].total += sc.byTopic[t].total;
    }
    store.write(prog);
  }

  var r = sc.possible ? sc.earned / sc.possible : 0;
  var h = '<div class="sc">' +
    '<svg class="ring" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.5" pathLength="100"/>' +
    '<circle class="fg" cx="18" cy="18" r="15.5" pathLength="100" stroke-dasharray="' + (r * 100).toFixed(1) + ' 100"/>' +
    '<text x="18" y="20">' + (sc.possible ? pct(r, 0) : "—") + "</text></svg>" +
    '<div class="scb"><div class="big">' + sc.earned + " of " + sc.possible + " correct</div>" +
    '<div class="sub">' + (sc.self ? sc.self + " written response" + (sc.self > 1 ? "s" : "") + " to mark yourself against the model answers. " : "") +
    (sc.missed.length ? "Solutions are now open on every question." : "Nothing missed — solutions are open below.") + "</div>";
  var ks = Object.keys(sc.byTopic);
  if (ks.length > 1) {
    h += '<div class="bars">';
    ks.forEach(function (t) { h += barHTML(TL[t], sc.byTopic[t].right, sc.byTopic[t].total); });
    h += "</div>";
  }
  h += "</div></div>";
  h += '<div class="actions" style="margin:0 0 20px;padding:0;border:0">' +
    (sc.missed.length ? '<button class="btn" id="retry">Retry the ' + sc.missed.length + " missed</button>" : "") +
    '<button class="btn ghost" id="again">New paper, same settings</button>' +
    '<button class="btn ghost" id="print">Print</button>' +
    (sc.missed.length ? '<button class="linkb" id="only">' + (S.onlyWrong ? "Show all questions" : "Show only what I missed") + "</button>" : "") +
    "</div>";

  document.getElementById("scorebox").innerHTML = h;
  var s1 = document.getElementById("submit"), s2 = document.getElementById("submit2");
  if (s1) s1.remove();
  if (s2) s2.parentNode.remove();
  applyOnlyWrong();
}
function applyOnlyWrong() {
  var nodes = document.querySelectorAll("#qs .q");
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].classList.toggle("hide", S.onlyWrong && !nodes[i].classList.contains("wrong"));
  }
}

/* ============================================================
   BROWSE + FORMULAS
   ============================================================ */
function viewBrowse() {
  var b = S.browse;
  var term = b.q.trim().toLowerCase();
  var list = B.questions.filter(function (q) {
    if (b.topic !== "all" && q.topic !== b.topic) return false;
    if (b.kind !== "all" && q.kind !== b.kind) return false;
    if (b.diff !== "all" && q.diff !== b.diff) return false;
    if (term) {
      var hay = (q.prompt + " " + q.lo + " " + (q.concepts || []).join(" ") + " " + q.src).toLowerCase();
      if (hay.indexOf(term) < 0) return false;
    }
    return true;
  });

  var h = "<h1>Browse the bank</h1>" +
    '<p class="avail" style="margin:9px 0 20px;max-width:64ch">All ' + B.meta.total +
    " questions with solutions open, for revision or looking something up. " + B.meta.quant + " quantitative, " +
    B.meta.mc + " multiple choice, " + B.meta.short + " short answer.</p>";

  h += '<fieldset class="fs"><legend>Find</legend>' +
    '<input class="srch" id="bq" type="search" placeholder="Search the questions — try &quot;Sharpe&quot;, &quot;unsmooth&quot;, &quot;drawdown&quot;" value="' + esc(b.q) + '">' +
    '<div class="pills" style="margin-top:12px">' +
    '<button class="pill" data-btopic="all" aria-pressed="' + (b.topic === "all") + '">All topics</button>';
  B.topics.forEach(function (t) {
    h += '<button class="pill" data-btopic="' + t.id + '" aria-pressed="' + (b.topic === t.id) + '" title="' + esc(t.label) + '">' + TCODE[t.id] + "</button>";
  });
  h += '</div><div class="pills" style="margin-top:9px">';
  [["all", "All types"], ["quant", "Quantitative"], ["mc", "Multiple choice"], ["short", "Short answer"]].forEach(function (k) {
    h += '<button class="pill" data-bkind="' + k[0] + '" aria-pressed="' + (b.kind === k[0]) + '">' + k[1] + "</button>";
  });
  h += '</div><div class="pills" style="margin-top:9px">';
  [["all", "All levels"], ["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].forEach(function (k) {
    h += '<button class="pill ' + (DIFFC[k[0]] || "") + '" data-bdiff="' + k[0] + '" aria-pressed="' + (b.diff === k[0]) + '">' + k[1] + "</button>";
  });
  h += "</div></fieldset>";

  h += '<p class="avail" style="margin:18px 0 14px">' + list.length + " question" + (list.length === 1 ? "" : "s") +
    (b.topic !== "all" ? " in " + esc(TL[b.topic]) : "") + "</p>";

  if (!list.length) return h + '<div class="empty"><p>Nothing matches those filters.</p></div>';

  var show = list.slice(0, b.limit);
  show.forEach(function (q, i) { h += questionHTML(prepare(q, i), true, false); });
  if (list.length > show.length) {
    h += '<div class="actions" style="border:0;padding:0"><button class="btn ghost" id="more">Show ' +
      Math.min(30, list.length - show.length) + ' more</button><span style="color:var(--mute);font-size:13.5px">' +
      show.length + " of " + list.length + " shown</span></div>";
  }
  return h;
}

function viewFormulas() {
  var h = "<h1>Formula sheet</h1>" +
    '<p class="avail" style="margin:9px 0 6px;max-width:64ch">Taken from the chapter slides, in the notation used in the solutions.</p>';
  B.topics.forEach(function (t) {
    var fs = B.formulas.filter(function (x) { return x.t === t.id; });
    if (!fs.length) return;
    h += '<div class="sect">' + esc(t.label) + "</div>";
    fs.forEach(function (x) {
      h += '<div class="fml"><div class="nm"><b>' + esc(x.n) + "</b><em>" + esc(x.s) + "</em></div><pre>" + esc(x.m) + "</pre></div>";
    });
  });
  return h;
}

/* ============================================================
   WIRING
   ============================================================ */
function renderNav() {
  var tabs = [["practice", S.exam ? "Exam" : "Practice"], ["browse", "Browse"], ["formulas", "Formulas"]];
  document.getElementById("nav").innerHTML = tabs.map(function (t) {
    return '<button data-tab="' + t[0] + '" aria-current="' + (S.tab === t[0]) + '">' + t[1] + "</button>";
  }).join("");
}
function render() {
  renderNav();
  var body = S.tab === "browse" ? viewBrowse() : S.tab === "formulas" ? viewFormulas() : (S.exam ? viewExam() : viewSetup());
  document.getElementById("app").innerHTML = (S.note ? '<div class="note g">' + esc(S.note) + "</div>" : "") + body;
  S.note = null;
  if (S.tab === "practice" && S.exam) {
    paintProgress();
    if (S.submitted) applyGrade(false);
    else if (S.cfg.timed) startClock();
  }
}
function startClock() {
  if (S.left == null) S.left = S.cfg.minutes * 60;
  var box = document.getElementById("clock");
  if (!box) return;
  function paint() {
    var m = Math.floor(S.left / 60), s = S.left % 60;
    box.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    box.className = "clock" + (S.left < 60 ? " warn" : "");
  }
  paint();
  if (S.tick) clearInterval(S.tick);
  S.tick = setInterval(function () {
    S.left--; paint();
    if (S.left <= 0) { clearInterval(S.tick); S.tick = null; submitExam(); }
  }, 1000);
}
function startExam(list) {
  S.exam = list; S.answers = {}; S.submitted = false; S.left = null; S.onlyWrong = false; S.tab = "practice";
  if (S.tick) { clearInterval(S.tick); S.tick = null; }
  render();
  window.scrollTo({ top: 0 });
}
function readInputs() {
  var cn = document.getElementById("cnt");
  if (cn) {
    var v = parseInt(cn.value, 10);
    if (isFinite(v)) S.cfg.count = Math.max(1, Math.min(60, v));
  }
  var mn = document.getElementById("mins");
  if (mn) {
    var m = parseInt(mn.value, 10);
    if (isFinite(m)) S.cfg.minutes = Math.max(1, Math.min(240, m));
  }
}
function toggle(arr, v) {
  var i = arr.indexOf(v);
  if (i >= 0) arr.splice(i, 1); else arr.push(v);
}

document.addEventListener("click", function (ev) {
  var t = ev.target.closest ? ev.target.closest("button") : null;
  if (!t) return;
  var c = S.cfg, d = t.dataset || {};

  if (d.tab) { readInputs(); S.tab = d.tab; render(); return; }

  /* setup controls */
  if (d.topic) { readInputs(); toggle(c.topics, d.topic); render(); return; }
  if (d.all) { readInputs(); c.topics = B.topics.map(function (x) { return x.id; }); render(); return; }
  if (d.none) { readInputs(); c.topics = []; render(); return; }
  if (d.type) {
    readInputs(); toggle(c.types, d.type);
    if (!c.types.length) c.types = ["quant"];
    render(); return;
  }
  if (d.diff) { readInputs(); toggle(c.diffs, d.diff); render(); return; }
  if (d.count) { readInputs(); c.count = +d.count; render(); return; }
  if (d.inc) {
    readInputs();
    c.count = Math.max(1, Math.min(60, c.count + (+d.inc)));
    render(); return;
  }
  if (d.flag) {
    readInputs();
    if (d.flag === "timed") c.timed = !c.timed;
    if (d.flag === "sol") c.solutions = c.solutions === "immediate" ? "after" : "immediate";
    if (d.flag === "rand") c.randomize = !c.randomize;
    if (d.flag === "unseen") c.unseen = !c.unseen;
    render(); return;
  }
  if (t.id === "reset") {
    S.cfg = {
      topics: B.topics.map(function (x) { return x.id; }), types: ["quant", "mc", "short"], diffs: [],
      count: 20, solutions: "after", timed: false, minutes: 30, unseen: true, randomize: true
    };
    S.note = "Choices reset."; render(); return;
  }
  if (t.id === "clear") { store.clear(); S.note = "Progress cleared."; render(); return; }

  if (t.id === "go" || t.id === "again") {
    readInputs();
    var ex = drawExam(c);
    if (!ex.length) { S.note = "Nothing matches that selection. Try adding topics or question types."; render(); return; }
    if (ex.length < c.count) {
      S.note = "Only " + ex.length + " question" + (ex.length === 1 ? "" : "s") +
        " match that selection, so this paper is shorter than requested.";
    }
    startExam(ex); return;
  }
  if (t.id === "retry") {
    var ids = {};
    (S.missed || []).forEach(function (x) { ids[x] = 1; });
    var again = B.questions.filter(function (q) { return ids[q.id]; }).map(prepare);
    if (again.length) { S.note = "Same questions, fresh start. Take your time."; startExam(again); }
    return;
  }
  if (t.id === "exit") {
    if (S.tick) { clearInterval(S.tick); S.tick = null; }
    S.exam = null; S.submitted = false; S.left = null; render(); window.scrollTo({ top: 0 }); return;
  }
  if (t.id === "print") { window.print(); return; }
  if (t.id === "submit" || t.id === "submit2") { submitExam(); return; }
  if (t.id === "only") { S.onlyWrong = !S.onlyWrong; applyOnlyWrong(); t.textContent = S.onlyWrong ? "Show all questions" : "Show only what I missed"; return; }
  if (t.id === "more") { S.browse.limit += 30; render(); return; }

  /* browse filters */
  if (d.btopic) { S.browse.topic = d.btopic; S.browse.limit = 30; render(); return; }
  if (d.bkind) { S.browse.kind = d.bkind; S.browse.limit = 30; render(); return; }
  if (d.bdiff) { S.browse.diff = d.bdiff; S.browse.limit = 30; render(); return; }

  /* in-exam */
  if (d.check) {
    var art = t.closest("article.q");
    markOne(S.exam[+art.dataset.n - 1], art, false);
    return;
  }
  if (d.ch != null && !S.submitted) {
    var a2 = t.closest("article.q"), n2 = +a2.dataset.n;
    if (!S.answers[n2]) S.answers[n2] = {};
    S.answers[n2].choice = +d.ch;
    var all = a2.querySelectorAll(".ch");
    for (var k = 0; k < all.length; k++) all[k].setAttribute("aria-pressed", String(k === +d.ch));
    paintProgress();
    return;
  }
});

document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "bq") {
    S.browse.q = t.value; S.browse.limit = 30;
    var pos = t.selectionStart; render();
    var f = document.getElementById("bq");
    if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (e) { } }
    return;
  }
  var art = t.closest ? t.closest("article.q") : null;
  if (!art || !art.dataset.n) return;
  var n = +art.dataset.n;
  if (!S.answers[n]) S.answers[n] = {};
  if (t.dataset.p != null) {
    if (!S.answers[n].parts) S.answers[n].parts = {};
    S.answers[n].parts[t.dataset.p] = t.value;
  } else if (t.dataset.free) S.answers[n].text = t.value;
  paintProgress();
});

document.getElementById("foot").innerHTML =
  "Built from <em>" + esc(B.meta.chapter) + "</em> and the instructor solutions for " + esc(B.meta.course) + " " +
  esc(B.meta.courseName) + " (" + esc(B.meta.instructor) + "). " + B.meta.total + " questions, bank built " + esc(B.meta.built) +
  ". This page runs entirely in your browser — no account, no tracking, and nothing you type leaves your device. " +
  "Progress is saved locally, so clearing your browser data will erase it.";

render();
</script>
</body>
</html>
