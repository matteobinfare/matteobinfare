<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINANC 4201 Practice Exam Platform v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.05em;
            opacity: 0.95;
            font-weight: 300;
        }

        .controls-section {
            background: #f8f9fa;
            padding: 25px 30px;
            border-bottom: 1px solid #e9ecef;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        select, input[type="text"] {
            padding: 10px 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 0.95em;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover, input[type="text"]:hover {
            border-color: #667eea;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .section-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .section-checkbox {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .section-checkbox:hover {
            background: #f0f3ff;
            border-color: #667eea;
        }

        .section-checkbox input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }

        .section-checkbox label {
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .section-count {
            font-size: 0.8em;
            color: #666;
            margin-left: auto;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 15px 30px;
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .questions-section {
            padding: 30px;
        }

        .question-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            background: #f0f3ff;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .question-card.concept {
            border-left-color: #28a745;
        }

        .question-card.workout {
            border-left-color: #ffc107;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 10px;
        }

        .question-number {
            font-weight: 700;
            color: #667eea;
            min-width: 60px;
        }

        .question-text {
            flex: 1;
            color: #333;
            font-size: 1.05em;
            line-height: 1.5;
        }

        .question-meta {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .badge-concept {
            background: #d4edda;
            color: #155724;
        }

        .badge-workout {
            background: #fff3cd;
            color: #856404;
        }

        .badge-easy {
            background: #cfe2ff;
            color: #084298;
        }

        .badge-medium {
            background: #e2e3e5;
            color: #383d41;
        }

        .badge-hard {
            background: #f8d7da;
            color: #842029;
        }

        .topic-tag {
            background: #e7f3ff;
            color: #0056b3;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8em;
        }

        .answer-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
            display: none;
        }

        .answer-section.show {
            display: block;
        }

        .answer-label {
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .answer-text {
            background: white;
            padding: 12px;
            border-radius: 4px;
            color: #333;
            margin-bottom: 10px;
            border-left: 3px solid #28a745;
        }

        .explanation-text {
            background: white;
            padding: 12px;
            border-radius: 4px;
            color: #333;
            margin-bottom: 10px;
            border-left: 3px solid #17a2b8;
        }

        .methodology-text {
            background: white;
            padding: 12px;
            border-radius: 4px;
            color: #333;
            border-left: 3px solid #ffc107;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px 30px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #e9ecef;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }

        @media (max-width: 768px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }

            .section-filters {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .question-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 FINANC 4201 Practice Exam Platform</h1>
            <p>Alternative Investments: Quantitative Methods & Performance Evaluation</p>
        </div>

        <div class="controls-section">
            <div class="controls-grid">
                <div class="control-group">
                    <label for="chapter-select">Chapter</label>
                    <select id="chapter-select">
                        <option value="">-- Select Chapter --</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="search-box">Search Questions</label>
                    <input type="text" id="search-box" placeholder="Search by keyword or topic...">
                </div>
            </div>

            <div class="control-group">
                <label>Topics (Select to Filter)</label>
                <div class="section-filters" id="section-filters"></div>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="loadQuestions()">Load Questions</button>
                <button class="btn-secondary" onclick="resetFilters()">Reset All</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="total-questions">0</div>
                <div class="stat-label">Total Questions</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="questions-displayed">0</div>
                <div class="stat-label">Displayed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="concept-count">0</div>
                <div class="stat-label">Concept</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="workout-count">0</div>
                <div class="stat-label">Workout</div>
            </div>
        </div>

        <div class="questions-section" id="questions-container">
            <div class="empty-state">
                <p>👋 Welcome! Select a chapter and topics above to begin practicing.</p>
            </div>
        </div>

        <div class="footer">
            <p>Created by Matteo Binfarè | University of Missouri | v2.0</p>
        </div>
    </div>

    <script>
        let questionsData = null;
        let filteredQuestions = [];

        // Load questions data
        fetch('bank.json')
            .then(response => response.json())
            .then(data => {
                questionsData = data;
                initializeUI();
            })
            .catch(error => console.error('Error loading questions:', error));

        function initializeUI() {
            populateChapterSelect();
            updateStats();
        }

        function populateChapterSelect() {
            const select = document.getElementById('chapter-select');
            questionsData.chapters.forEach((chapter, idx) => {
                const option = document.createElement('option');
                option.value = chapter.id;
                option.textContent = chapter.name;
                select.appendChild(option);
            });

            select.addEventListener('change', updateSectionFilters);
        }

        function updateSectionFilters() {
            const chapterId = document.getElementById('chapter-select').value;
            const container = document.getElementById('section-filters');
            container.innerHTML = '';

            if (!chapterId) {
                return;
            }

            const chapter = questionsData.chapters.find(c => c.id === chapterId);
            if (!chapter) return;

            const topicsSet = new Set();
            chapter.sections.forEach(section => {
                section.questions.forEach(question => {
                    topicsSet.add(question.topic);
                });
            });

            const topics = Array.from(topicsSet).sort();

            topics.forEach(topic => {
                const label = document.createElement('label');
                label.className = 'section-checkbox';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = topic;
                checkbox.className = 'topic-checkbox';

                const topicLabel = document.createElement('label');
                topicLabel.style.margin = '0';
                topicLabel.textContent = topic;

                const count = countQuestionsByTopic(chapter, topic);
                const countSpan = document.createElement('span');
                countSpan.className = 'section-count';
                countSpan.textContent = `(${count})`;

                label.appendChild(checkbox);
                label.appendChild(topicLabel);
                label.appendChild(countSpan);
                container.appendChild(label);
            });
        }

        function countQuestionsByTopic(chapter, topic) {
            return chapter.sections.reduce((total, section) => {
                return total + section.questions.filter(q => q.topic === topic).length;
            }, 0);
        }

        function loadQuestions() {
            const chapterId = document.getElementById('chapter-select').value;
            const searchTerm = document.getElementById('search-box').value.toLowerCase();
            const selectedTopics = Array.from(document.querySelectorAll('.topic-checkbox:checked')).map(cb => cb.value);

            if (!chapterId) {
                alert('Please select a chapter first');
                return;
            }

            const chapter = questionsData.chapters.find(c => c.id === chapterId);
            filteredQuestions = [];

            chapter.sections.forEach(section => {
                section.questions.forEach(question => {
                    const matchesTopic = selectedTopics.length === 0 || selectedTopics.includes(question.topic);
                    const matchesSearch = searchTerm === '' || 
                        question.question.toLowerCase().includes(searchTerm) ||
                        question.topic.toLowerCase().includes(searchTerm) ||
                        question.answer.toLowerCase().includes(searchTerm);

                    if (matchesTopic && matchesSearch) {
                        filteredQuestions.push({
                            ...question,
                            chapter: chapter.name,
                            section: section.name
                        });
                    }
                });
            });

            displayQuestions();
            updateStats();
        }

        function displayQuestions() {
            const container = document.getElementById('questions-container');

            if (filteredQuestions.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No questions match your filters. Try adjusting your selection.</p></div>';
                return;
            }

            container.innerHTML = '';
            filteredQuestions.forEach((question, idx) => {
                const card = createQuestionCard(question, idx + 1);
                container.appendChild(card);
            });
        }

        function createQuestionCard(question, displayIdx) {
            const card = document.createElement('div');
            card.className = `question-card ${question.type}`;

            const typeLabel = question.type.charAt(0).toUpperCase() + question.type.slice(1);
            const difficultyLabel = question.difficulty.charAt(0).toUpperCase() + question.difficulty.slice(1);

            let answerContent = `<div class="answer-text"><strong>Answer:</strong> ${question.answer}</div>`;

            if (question.explanation) {
                answerContent += `<div class="explanation-text"><strong>Explanation:</strong> ${question.explanation}</div>`;
            }

            if (question.methodology) {
                answerContent += `<div class="methodology-text"><strong>Methodology:</strong> ${question.methodology}</div>`;
            }

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-number">Q${displayIdx}</div>
                    <div class="question-text">${question.question}</div>
                </div>
                <div class="question-meta">
                    <span class="badge badge-${question.type}">${typeLabel}</span>
                    <span class="badge badge-${question.difficulty}">${difficultyLabel}</span>
                    <span class="topic-tag">${question.topic}</span>
                </div>
                <div class="answer-section" id="answer-${displayIdx}">
                    ${answerContent}
                </div>
            `;

            card.addEventListener('click', () => {
                const answerDiv = document.getElementById(`answer-${displayIdx}`);
                answerDiv.classList.toggle('show');
            });

            return card;
        }

        function updateStats() {
            const conceptCount = filteredQuestions.filter(q => q.type === 'concept').length;
            const workoutCount = filteredQuestions.filter(q => q.type === 'workout').length;

            document.getElementById('total-questions').textContent = questionsData?.chapters.reduce((total, chapter) => {
                return total + chapter.sections.reduce((sectionTotal, section) => {
                    return sectionTotal + section.questions.length;
                }, 0);
            }, 0) || 0;

            document.getElementById('questions-displayed').textContent = filteredQuestions.length;
            document.getElementById('concept-count').textContent = conceptCount;
            document.getElementById('workout-count').textContent = workoutCount;
        }

        function resetFilters() {
            document.getElementById('chapter-select').value = '';
            document.getElementById('search-box').value = '';
            document.querySelectorAll('.topic-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('section-filters').innerHTML = '';
            document.getElementById('questions-container').innerHTML = '<div class="empty-state"><p>👋 Welcome! Select a chapter and topics above to begin practicing.</p></div>';
            updateStats();
        }

        // Search input listener
        document.getElementById('search-box').addEventListener('keyup', () => {
            if (filteredQuestions.length > 0) {
                loadQuestions();
            }
        });
    </script>
</body>
</html>
